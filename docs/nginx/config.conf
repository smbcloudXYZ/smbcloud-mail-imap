worker_processes auto;

mail {
    server_name smtp.thestablefoundation.org;
    auth_http   localhost:8080;

    proxy_pass_error_message on;

    ssl                 on;
    ssl_certificate     /etc/letsencrypt/live/smtp.thestablefoundation.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smtp.thestablefoundation.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Port 25: INCOMING mail (no auth required)
    server {
        listen     25;
        protocol   smtp;
        starttls   on;
        proxy      on;
        # NO smtp_auth here - accept mail from anyone
    }

    # Port 587: OUTGOING mail (auth required for your users)
    server {
        listen     587;
        protocol   smtp;
        smtp_auth  login plain;
        starttls   on;
        proxy      on;
    }

    server {
        listen   1143;
        protocol imap;
    }
}
