worker_processes auto;

mail {
    server_name smtp.thestablefoundation.org;
    auth_http   localhost:8080;

    proxy_pass_error_message on;

    ssl                 on;
    ssl_certificate     /etc/letsencrypt/live/smtp.thestablefoundation.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smtp.thestablefoundation.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    server {
        listen     2525;
        protocol   smtp;
        smtp_auth  login plain cram-md5;
    }

    server {
        listen   1143;
        protocol imap;
    }
}
